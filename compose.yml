name: three-tier-lab

services:

  # -------------------------------------------------------
  # PostgreSQL
  # -------------------------------------------------------

  database:
    image: postgres:17-alpine

    environment:
        POSTGRES_DB: ${DATABASE_NAME}
        POSTGRES_USER: ${DATABASE_USER}
        POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

    volumes:
        - postgres-data:/var/lib/postgresql/data

    networks:
        - backend-network

    healthcheck:
        test:
            [
                "CMD-SHELL",
                "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"
            ]
        interval: 5s
        timeout: 3s
        retries: 5
        start_period: 10s

    restart: unless-stopped

    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200

    logging:
        driver: json-file
        options:
            max-size: "10m"
            max-file: "3"


  # -------------------------------------------------------
  # FastAPI
  # -------------------------------------------------------

  backend:
    image: ${BACKEND_IMAGE}


    # Alternatively build locally:
    #
    # build:
    #   context: ./backend
    #   dockerfile: Dockerfile

    environment:
        APP_ENV: production

        DATABASE_HOST: database
        DATABASE_PORT: 5432
        DATABASE_NAME: ${DATABASE_NAME}
        DATABASE_USER: ${DATABASE_USER}
        DATABASE_PASSWORD: ${DATABASE_PASSWORD}

    networks:
        - frontend-network
        - backend-network

    expose:
        - "8000"

    depends_on:
        database:
            condition: service_healthy


    healthcheck:
        test:
            [
                "CMD",
                "python",
                "-c",
                "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
            ]
        interval: 10s
        timeout: 3s
        retries: 3
        start_period: 20s

    restart: unless-stopped

    init: true

    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100

    security_opt:
        - no-new-privileges:true

    logging:
        driver: json-file
        options:
            max-size: "10m"
            max-file: "3"

  # -------------------------------------------------------
  # Nginx load balancer
  # -------------------------------------------------------

  load-balancer:
    image: nginx:1.27-alpine

    ports:
        - "8080:80"

    volumes:
        - ./load-balancer/nginx.conf:/etc/nginx/nginx.conf:ro

    networks:
        - frontend-network

    depends_on:
        backend:
            condition: service_healthy

    healthcheck:
        test:
            [
                "CMD",
                "wget",
                "-q",
                "--spider",
                "http://127.0.0.1/api/health"
            ]
        interval: 10s
        timeout: 3s
        retries: 3

    restart: unless-stopped

    mem_limit: 128m
    cpus: 0.25
    pids_limit: 100

    logging:
        driver: json-file
        options:
            max-size: "10m"
            max-file: "3"


  # -------------------------------------------------------
  # React frontend
  # -------------------------------------------------------

  frontend:
    image: ${FRONTEND_IMAGE}

    environment:
        API_URL: ${API_URL}

    ports:
        - "80:80"

    networks:
        - frontend-network

    depends_on:
        load-balancer:
            condition: service_healthy

    healthcheck:
        test:
            [
                "CMD",
                "wget",
                "-q",
                "--spider",
                "http://localhost/"
            ]
        interval: 10s
        timeout: 3s
        retries: 3
        start_period: 5s

    restart: unless-stopped

    mem_limit: 128m
    cpus: 0.25
    pids_limit: 100

    logging:
        driver: json-file
        options:
            max-size: "10m"
            max-file: "3"

# ---------------------------------------------------------
# Networks
# ---------------------------------------------------------

networks:

    frontend-network:
        driver: bridge

    backend-network:
        driver: bridge
        internal: true

# ---------------------------------------------------------
# Persistent storage
# ---------------------------------------------------------

volumes:

    postgres-data:
